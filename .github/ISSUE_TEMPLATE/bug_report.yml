name: Bug report
description: Report a problem using a written or synthetic reproduction
body:
  - type: markdown
    attributes:
      value: "Never attach private photos, review ZIPs, albums, full logs, credentials or signing files. Use a synthetic reproduction."
  - type: input
    id: version
    attributes:
      label: App and Android version
      placeholder: "0.4.0-beta1 / Android version"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use invented data. Describe the steps without attaching personal material.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have included no private photos, review ZIPs, albums, full logs or secrets.
          required: true